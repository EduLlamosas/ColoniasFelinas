server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las fotos se admiten hasta 8MB en el backend; el límite por defecto de Nginx es 1MB.
    client_max_body_size 10m;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html y React Router
    # decide el resto en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # proxy_pass sin ruta después del host conserva el URI original tal cual (incluye
    # /graphql y /uploads/<archivo>.webp), así que un único location por prefijo basta.
    location /graphql {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
